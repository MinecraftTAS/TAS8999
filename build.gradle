plugins {
	id 'java'
	id 'application'
	id "com.diffplug.spotless" version "8.4.0"
	id 'com.gradleup.shadow' version '9.4.1'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation("net.dv8tion:JDA:6.4.1") {
		exclude module: 'opus-java'
		exclude module: 'tink'
	}

	implementation("ch.qos.logback:logback-classic:1.5.32")
}

version = project.version

base {
	archivesName = "TAS8999"
}

application {
	mainClass = 'com.minecrafttas.tas8999.TAS8999'
}

java {
	sourceCompatibility = targetCompatibility = 24
}

spotless {
	encoding "UTF-8"
	lineEndings "UNIX"
	java {
		importOrderFile("formatter/Importorder.txt")
		eclipse().configFile("formatter/Formatter.xml")
	}
	enforceCheck false
}